name: Deploy to GitHub Pages

# Publishes the repository (including the WindNow app under /wind-app) to
# GitHub Pages. The wind app will be available at:
#   https://<owner>.github.io/<repo>/wind-app/
on:
  push:
    branches:
      - main
      - claude/new-session-57a1sz
      - claude/roofing-service-website-9qjp9j
  workflow_dispatch:

# Permissions required by the Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Attempt to auto-enable Pages via the workflow token so no manual
          # repo setting is required. Falls back to a clear error if the
          # account/org policy disallows it.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repo so existing files (e.g. privacy-policy.html)
          # keep working; the wind app lives at /wind-app/.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>RCFZ Content Radar</title>
<meta name="description" content="Private, offline-first workflow app for RC content discovery, saved videos and the editing queue." />
<meta name="theme-color" content="#06080B" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RCFZ Radar" />
<meta name="format-detection" content="telephone=no" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar" hidden></header>
    <main id="view" class="view" tabindex="-1">
      <div class="boot">
        <div class="boot-mark"></div>
        <p class="boot-txt">RCFZ CONTENT RADAR</p>
      </div>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Primary" hidden></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#E9EEF6;font:16px system-ui">RCFZ Content Radar needs JavaScript enabled.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
